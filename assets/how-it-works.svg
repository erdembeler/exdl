<svg xmlns="http://www.w3.org/2000/svg" width="850" height="260" viewBox="0 0 850 260" role="img" aria-labelledby="title desc">
  <title id="title">How EXdl works</title>
  <desc id="desc">EXdl detects a mounted disk image, copies the app to the external drive and adds a small launcher to /Applications that opens the app from the drive.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FB4FF"/>
      <stop offset="0.6" stop-color="#3A80F5"/>
      <stop offset="1" stop-color="#2C5FDD"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="30" cy="0" r="380">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1.5 1.5 L8.5 5 L1.5 8.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A1F5C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="850" height="260" rx="22" fill="url(#bg)"/>
  <rect width="850" height="260" rx="22" fill="url(#glow)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#fff">
    <!-- connectors -->
    <g fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
      <path d="M192 130 H296" marker-end="url(#arrow)"/>
      <path d="M432 124 H462 Q470 124 470 116 V74 Q470 66 478 66 H606" marker-end="url(#arrow)"/>
      <path d="M432 136 H462 Q470 136 470 144 V186 Q470 194 478 194 H606" marker-end="url(#arrow)"/>
      <path d="M715 158 V102" stroke-dasharray="1 7" marker-end="url(#arrow)"/>
    </g>

    <!-- connector labels -->
    <g font-size="13" font-weight="500" fill-opacity="0.92">
      <text x="244" y="118">detects</text>
      <text x="543" y="56">copies the app</text>
      <text x="543" y="184">adds a launcher</text>
      <text x="727" y="134" text-anchor="start">opens</text>
    </g>

    <!-- nodes -->
    <g filter="url(#shadow)">
      <rect x="32" y="100" width="160" height="60" rx="14" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.45" stroke-width="1.5"/>
      <rect x="298" y="100" width="134" height="60" rx="14" fill="#fff"/>
      <rect x="610" y="36" width="210" height="60" rx="14" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.45" stroke-width="1.5"/>
      <rect x="610" y="164" width="210" height="60" rx="14" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.45" stroke-width="1.5"/>
    </g>

    <g font-size="16" font-weight="600">
      <text x="112" y="126">Disk image</text>
      <text x="715" y="62">External drive</text>
      <text x="715" y="190">/Applications</text>
    </g>
    <g font-size="12.5" fill-opacity="0.82">
      <text x="112" y="146">.dmg</text>
      <text x="715" y="82">full app</text>
      <text x="715" y="210">launcher</text>
    </g>
    <text x="365" y="137" font-size="21" font-weight="700" fill="#2C5FDD">EXdl</text>
  </g>
</svg>
